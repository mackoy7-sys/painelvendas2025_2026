body{background:var(--bg);color:var(--ink);font-family:var(--font-d);margin:0}

function hover(box,tipId,hits,fn){

      const d=fn(r,b); tip.style.left=d.x+'px'; tip.style.top=d.y+'px'; tip.innerHTML=d.html; tip.style.opacity=1;};

   {l:'Vidas '+rotPer(),v:nf(tot),s:t25?pp((tot/t25-1)*100)+'% vs mesmo período de 2025':'sem base em 2025',c:t25&&tot>=t25?'up':'dn'},

function barras(id,arr,fmt,cor,aria){
  const W=560,H=300,L=46,R=542,TOP=24,BOT=238;
  const vv0=arr.filter(v=>v!=null&&v>0); const hi=(vv0.length?Math.max(...vv0):1)*1.16, st=hi>900?250:hi>400?100:hi>150?50:hi>60?20:10;
  const cw=(R-L)/arr.length, bw=cw*0.6, y=v=>BOT-v/hi*(BOT-TOP);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`+eixoY(L,R,TOP,BOT,0,hi,st,fmt);
  arr.forEach((v,i)=>{const x=L+cw*i+(cw-bw)/2;
    if(v!=null){s+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(BOT-y(v)).toFixed(1)}" fill="${cor}" rx="2.5"/>`;
      s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(v)-7).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-2)" font-family="var(--font-d)">${fmt(v)}</text>`;}
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${M[i]}</text>`;});
  s+='</svg>';
  document.getElementById(id).insertAdjacentHTML('afterbegin',s);}
function linha(id,arr,fmt,cor,aria){
  const W=560,H=300,L=46,R=542,TOP=26,BOT=238;
  const vv=arr.filter(v=>v!=null);
  if(!vv.length){document.getElementById(id).insertAdjacentHTML('afterbegin',
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="12" fill="var(--ink-3)" font-family="var(--font-d)">sem vendas no período</text></svg>`); return;}
  let lo=Math.min(...vv), hi=Math.max(...vv); const pad=(hi-lo)*0.28||2; lo-=pad; hi+=pad;
  const st=(hi-lo)>40?10:(hi-lo)>16?5:(hi-lo)>8?2:1;
  const x=i=>arr.length>1?L+i*(R-L)/(arr.length-1):(L+R)/2, y=v=>BOT-(v-lo)/(hi-lo)*(BOT-TOP);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`+eixoY(L,R,TOP,BOT,lo,hi,st,v=>fmt(v));
  let dd='',op=false;
  arr.forEach((v,i)=>{if(v==null){op=false;return;} dd+=(op?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; op=true;});
  if(dd) s+=`<path d="${dd.trim()}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>`;
  arr.forEach((v,i)=>{if(v==null)return;
    s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${cor}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const up=!(i>0&&i<arr.length-1&&arr[i-1]>v&&arr[i+1]>v);
    s+=`<text x="${x(i)}" y="${(y(v)+(up?-11:19)).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="var(--font-d)">${fmt(v)}</text>`;});
  s+=mesesX(L,R,BOT,arr.length,M);
  s+='</svg>';
  document.getElementById(id).insertAdjacentHTML('afterbegin',s);}

/* ===== empilhado 100% generico ===== */
function empilhado(id,series,cores,tintas,rotulos,aria){
  const c=o(), mt=c.mt;
  const W=620,H=330,L=40,R=606,TOP=14,BOT=252;
  const cw=(R-L)/M.length, bw=cw*0.66;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  [0,25,50,75,100].forEach(t=>{const yy=BOT-t/100*(BOT-TOP);
    s+=`<line x1="${L}" y1="${yy}" x2="${R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--font-d)">${t}%</text>`;});
  for(let j=0;j<M.length;j++){
    const x=L+cw*j+(cw-bw)/2; let acc=0;
    series.forEach((row,g)=>{
      const v=mt[j]?row[j]/mt[j]*100:0; if(v<=0)return;
      const h=v/100*(BOT-TOP), y=BOT-(acc+v)/100*(BOT-TOP); acc+=v;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h-2,0.5).toFixed(1)}" fill="${cores[g]}" rx="1.5"/>`;
      if(h>=16) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y+h/2+3.5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="500" fill="${tintas[g]}" font-family="var(--font-d)">${p1(v)}</text>`;});
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${M[j]}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+34}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--font-d)">${nf(mt[j])}</text>`;
    s+=`<rect class="he" data-j="${j}" x="${(L+cw*j).toFixed(1)}" y="${TOP}" width="${cw.toFixed(1)}" height="${BOT-TOP}" fill="transparent"/>`;}
  s+='</svg>';
  const b=document.getElementById(id); b.insertAdjacentHTML('afterbegin',s);
  hover(b,'.tip','.he',(r,bb)=>{const j=+r.dataset.j,k=bb.width/W;
    return {x:(L+cw*j+cw/2)*k,y:TOP*k+8,
      html:`<b>${M[j]}/26</b> · ${nf(mt[j])} vidas<br>`+series.map((row,g)=>({n:rotulos[g],v:mt[j]?row[j]/mt[j]*100:0,q:row[j]}))
        .filter(z=>z.q>0).sort((a,b2)=>b2.v-a.v).map(z=>`${esc(z.n)}: ${p1(z.v)}% (${nf(z.q)})`).join('<br>')};});}

/* ===== matriz generica ===== */
function matriz(alvo,linhas,getv,fmtv,extra,totalLinha,rodape){
  const mx=Math.max(...linhas.flatMap((_,i)=>M.map((_,j)=>getv(i,j)||0)),1);
  let h='<table><thead><tr><th class="k">'+alvo.rot+'</th><th>Ano</th>'+M.map(m=>`<th>${m}</th>`).join('')+
    (extra?extra.cab:'')+'</tr></thead><tbody>';
  linhas.forEach((ln,i)=>{
    h+=`<tr><td class="k">${ln.html}</td><td class="num">${totalLinha(i)}</td>`+
      M.map((_,j)=>{const v=getv(i,j);
        return `<td class="num" style="background:color-mix(in srgb, var(--s1) ${((v||0)/mx*76).toFixed(0)}%, transparent)">${fmtv(v)}</td>`;}).join('')+
      (extra?extra.cel(i):'')+'</tr>';});
  h+='</tbody><tfoot>'+rodape+'</tfoot></table>';
  return '<div class="tcard"><div class="scroll">'+h+'</div></div>';}

    const hw=n>1?(R-L)/(n-1):(R-L);
    const path=(f,z)=>V.slice(f,z).map((v,k)=>(k?'L':'M')+x(f+k).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vidas por mês em ${esc(META.canais[canal])}, ${rotPer()}, com a média da primeira metade do período">`;
    for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){const yy=y(v);
      s+=`<line x1="${L}" y1="${yy.toFixed(1)}" x2="${R}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`+
         `<text x="${L-12}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="12.5" fill="var(--ink-3)" font-family="var(--font-d)">${nf(v)}</text>`;}
    s+=`<line x1="${L}" y1="${y(m1).toFixed(1)}" x2="${R}" y2="${y(m1).toFixed(1)}" stroke="var(--c7)" stroke-width="2" stroke-dasharray="7 5"/>`;
    if(dFim!=null&&Math.abs(y(V[a])-y(V[u]))>26){
      const yT=y(V[a]), yB=y(V[u]), xA=x(u), yMid=(yT+yB)/2, dn=yB>yT, sg=dn?1:-1;
      s+=`<line x1="${x(a)}" y1="${yT.toFixed(1)}" x2="${xA}" y2="${yT.toFixed(1)}" stroke="var(--c2)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>`;
      s+=`<line x1="${xA}" y1="${(yT+7*sg).toFixed(1)}" x2="${xA}" y2="${(yB-7*sg).toFixed(1)}" stroke="var(--c2)" stroke-width="1.5"/>`;
      s+=`<path d="M${xA-4.5} ${(yT+8*sg).toFixed(1)} L${xA} ${(yT+1*sg).toFixed(1)} L${xA+4.5} ${(yT+8*sg).toFixed(1)} Z" fill="var(--c2)"/>`;
      s+=`<path d="M${xA-4.5} ${(yB-8*sg).toFixed(1)} L${xA} ${(yB-1*sg).toFixed(1)} L${xA+4.5} ${(yB-8*sg).toFixed(1)} Z" fill="var(--c2)"/>`;
      s+=`<text x="${xA-13}" y="${(yMid-1).toFixed(1)}" text-anchor="end" font-size="16" font-weight="700" fill="var(--c2)" font-family="var(--font-d)">${pp(dFim)}%</text>`;
      s+=`<text x="${xA-13}" y="${(yMid+15).toFixed(1)}" text-anchor="end" font-size="12.5" fill="var(--ink-2)" font-family="var(--font-d)">${M[a]} → ${M[u]}</text>`;}
    s+=`<path d="${path(0,K)}" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s+=`<path d="${path(a,n)}" fill="none" stroke="var(--c2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    V.forEach((v,i)=>{
      s+=`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="5.5" fill="${i<K?'var(--c1)':'var(--c2)'}" stroke="var(--surface)" stroke-width="2"/>`;
      const up=!(i>0&&i<n-1&&V[i-1]>v&&V[i+1]>v)&&i!==n-1;
      s+=`<text x="${x(i)}" y="${(y(v)+(up?-15:25)).toFixed(1)}" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--font-d)">${nf(v)}</text>`;
      s+=`<text x="${x(i)}" y="${BOT+28}" text-anchor="middle" font-size="13.5" fill="var(--ink-2)" font-family="var(--font-d)">${M[i]}</text>`;
      s+=`<text x="${x(i)}" y="${BOT+58}" text-anchor="middle" font-size="12.5" fill="var(--ink-2)" font-family="var(--font-d)">${T[i]!=null?nf(T[i]):'—'}</text>`;
      s+=`<rect class="hr" data-i="${i}" x="${(x(i)-hw/2).toFixed(1)}" y="${TOP}" width="${hw.toFixed(1)}" height="${BOT-TOP}" fill="transparent"/>`;});
    s+=`<line x1="${L}" y1="${BOT+40}" x2="${R}" y2="${BOT+40}" stroke="var(--line)" stroke-width="1"/>`;
    s+='</svg>';
    const bx=document.getElementById('r1'); bx.insertAdjacentHTML('afterbegin',s);
    hover(bx,'.tip','.hr',(r,bb)=>{const i=+r.dataset.i,k=bb.width/W;
      return {x:x(i)*k, y:y(V[i])*k, html:`<b>${M[i]}/26</b> · ${nf(V[i])} vidas<br>ticket R$ ${T[i]!=null?nf(T[i]):'—'}`+
        (V25[i]?`<br>vs 2025: ${pp((V[i]/V25[i]-1)*100)}%`:'')};});
  })();

  const tv=sum(V), tv25=sum(V25), ttk=tv?sum(c.rec)/tv:null;
  let h='<table><thead><tr><th class="k">Mês</th><th>Vidas</th><th>Ticket médio</th><th>Receita (R$ mil)</th><th>2025</th><th>vs 2025</th></tr></thead><tbody>';
  M.forEach((m,i)=>{const d=V25[i]?(V[i]/V25[i]-1)*100:null;
    h+=`<tr><td class="k"><i style="background:${i<K?'var(--c1)':'var(--c2)'}"></i>${m}</td>`+
       `<td class="num">${nf(V[i])}</td><td class="num">${T[i]!=null?nf(T[i]):'—'}</td>`+
       `<td class="num">${rk(c.rec[i])}</td><td class="num">${nf(V25[i])}</td>`+
       `<td class="d ${d!=null&&d>=0?'up':'dn'}">${d!=null?pp(d)+'%':'—'}</td></tr>`;});
  h+=`</tbody><tfoot><tr><td class="k">${rotPer()}</td><td>${nf(tv)}</td><td>${ttk!=null?nf(ttk):'—'}</td>`+
     `<td>${rk(sum(c.rec))}</td><td>${nf(tv25)}</td>`+
     `<td class="d ${tv25&&tv>=tv25?'up':'dn'}">${tv25?pp((tv/tv25-1)*100)+'%':'—'}</td></tr></tfoot></table>`;
  document.getElementById('r2').innerHTML='<div class="tcard"><div class="scroll">'+h+'</div></div>';}

/* ===== chrome ===== */
function unidadeBar(){
  return `<div class="bar"><div class="seg" role="group" aria-label="Unidade" id="segUni">
    <button type="button" data-u="pct" aria-pressed="${unidade==='pct'}">% do mês</button>
    <button type="button" data-u="abs" aria-pressed="${unidade==='abs'}">Vidas</button>
  </div><span class="hint">${M.length>1?`Δ pp compara ${rotB()} com ${rotA()}. ${rotUF()} é a variação de vidas entre ${M[0]} e ${M.at(-1)}.`:'Mês isolado: sem comparação entre períodos.'}</span></div>`;}
const ABAS=[['geral','Visão geral',abaGeral,pintaGeral],
  ['ritmo','Ritmo',abaRitmo,pintaRitmo],
  ['faixa','Faixa etária',abaFaixa,pintaFaixa],
  ['plano','Aquisição por plano',abaPlano,pintaPlano],
  ['cruz','Plano × Faixa',abaCruz,pintaCruz],
  ['cidade','Cidades',abaCidade,pintaCidade],
  ['o8','0 a 8 anos',abaO8,pintaO8]];
document.getElementById('tabs').innerHTML=ABAS.map(a=>
  `<button type="button" role="tab" data-a="${a[0]}" aria-selected="${a[0]===aba}">${a[1]}</button>`).join('');
document.getElementById('segCanal').innerHTML=Object.keys(META.canais).map(k=>
  `<button type="button" data-k="${k}" aria-pressed="${k===canal}"${META.grupo&&META.grupo[k]==='o'?' style="border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:3px"':''}>${META.canais[k]}</button>`).join('');
document.getElementById('corte').textContent='Corte '+META.corte+' · '+nf(META.base)+' registros na base'+(META.obs?' · '+META.obs:'');
document.getElementById('rodape').innerHTML='Vidas por mês de cadastramento · ticket = mensalidade média · receita = soma das mensalidades contratadas no mês · '+
  'base BASE_DIGITAL_FULL, corte '+META.corte+'. Para atualizar, substitua o bloco de dados no topo do script.'+
  (META.obs_det?'<br><strong>Atenção:</strong> '+META.obs_det:'');
// atalhos de periodo: ano todo + trimestres civis existentes na base (+ ultimo mes, se nao coincidir)
function presets(){
  const n=MESES.length, L=[[MESES[0]+'–'+MESES[n-1],0,n-1]];
  for(let q=0;q<4;q++){const a=q*3; if(a>n-1)break; L.push([(q+1)+'º tri',a,Math.min(a+2,n-1)]);}
  if(!L.some(z=>z[1]===n-1&&z[2]===n-1)) L.push(['Último mês',n-1,n-1]);
  return L;}
const PRESETS=presets();
function pintaPeriodo(){
  document.getElementById('segPer').innerHTML=PRESETS.map((pz,i)=>
    `<button type="button" data-p="${i}" aria-pressed="${mA===pz[1]&&mB===pz[2]}">${pz[0]}</button>`).join('');
  const opts=v=>MESES.map((m,i)=>`<option value="${i}"${i===v?' selected':''}>${m}</option>`).join('');
  document.getElementById('mDe').innerHTML=opts(mA);
  document.getElementById('mAte').innerHTML=opts(mB);
  document.getElementById('hintPer').textContent=M.length===1
    ? 'Mês isolado: '+MESFULL[mA]+'/26.'
    : M.length+' meses · '+rotPer()+'. Todas as abas seguem este recorte.';
  document.querySelectorAll('#segPer [data-p]').forEach(b=>b.onclick=()=>{
    const pz=PRESETS[+b.dataset.p]; mA=pz[1]; mB=pz[2]; render();});
  document.getElementById('mDe').onchange=e=>{mA=+e.target.value; if(mB<mA) mB=mA; render();};
  document.getElementById('mAte').onchange=e=>{mB=+e.target.value; if(mA>mB) mA=mB; render();};}
function render(){
  M=MESES.slice(mA,mB+1);
  pintaPeriodo();
  const A=ABAS.find(a=>a[0]===aba);
  const extra=canal==='HCOR'?' Corretoras parceiras na plataforma HapON; a venda começou em agosto.':
    canal==='HINT'?' Tudo o que não veio pelas corretoras da HapON.':
    canal==='HTOT'?' Soma de HapON Interno ('+nf(sum(cut(DB.d.HINT.mt)))+') + HapON Corretoras ('+nf(sum(cut(DB.d.HCOR.mt)))+') — mesma base de Todos os canais.':'';
  document.getElementById('hintCanal').textContent=nf(sum(o().mt))+' vidas em '+META.canais[canal]+', '+rotPer()+'.'+extra;
  kpis();
  document.getElementById('painel').innerHTML=A[2]();
  A[3]();
  document.querySelectorAll('#segUni [data-u]').forEach(b=>b.onclick=()=>{unidade=b.dataset.u;render();});
}
document.querySelectorAll('#tabs [data-a]').forEach(b=>b.onclick=()=>{aba=b.dataset.a;
  document.querySelectorAll('#tabs [data-a]').forEach(z=>z.setAttribute('aria-selected',z===b)); render();});
document.querySelectorAll('#segCanal [data-k]').forEach(b=>b.onclick=()=>{canal=b.dataset.k;
  document.querySelectorAll('#segCanal [data-k]').forEach(z=>z.setAttribute('aria-pressed',z===b)); render();});
render();
</script>
