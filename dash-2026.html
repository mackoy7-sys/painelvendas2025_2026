<style>
/* Layout: cabecalho fixo com filtro de canal, abas, e paineis de cartoes por visao. */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#eef1f6; --line:#dfe3ea;
  --ink:#10151d; --ink-2:#4e5767; --ink-3:#79839a; --on-dark:#ffffff;
  --s1:#2a78d6; --s2:#eb6834;

  --font-d:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151a; --surface:#1a1e25; --surface-2:#232832; --line:#2f3642;
  --ink:#f0f2f6; --ink-2:#b4bdcc; --ink-3:#848ea0; --on-dark:#0c1017;
  --s1:#3987e5; --s2:#d95926;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#79839a;
  --r1:#cde2fb; --r2:#86b6ef; --r3:#3987e5; --r4:#256abf; --r5:#184f95; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1a1e25; --surface-2:#232832; --line:#2f3642;
  --ink:#f0f2f6; --ink-2:#b4bdcc; --ink-3:#848ea0; --on-dark:#0c1017;
  --s1:#3987e5; --s2:#d95926;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#79839a;
  --r1:#cde2fb; --r2:#86b6ef; --r3:#3987e5; --r4:#256abf; --r5:#184f95; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-d);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:clamp(18px,2.6vw,23px);margin:0;font-weight:700;letter-spacing:-.02em}
.corte{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-3);background:none;border:0;
  border-bottom:2.5px solid transparent;padding:9px 13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
.tabs button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.wrap{max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:0;
  padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,21,29,.12)}
.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.hint{font-size:12.5px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:400px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px 11px;
  display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500;line-height:1.3}
.kpi .val{font-size:clamp(18px,2.6vw,25px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .sub{font-size:12px;font-weight:500;color:var(--ink-3);line-height:1.35;font-variant-numeric:tabular-nums}
.kpi .sub.up{color:var(--s1)} .kpi .sub.dn{color:var(--s2)}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.row2.even{grid-template-columns:1fr 1fr}
@media (max-width:880px){.row2,.row2.even{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 15px 9px;min-width:0}
h2{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em}
.csub{font-size:12px;color:var(--ink-3);margin:3px 0 0;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--ink-2);font-weight:500;padding:9px 2px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative}
svg{display:block;width:100%;height:auto}
svg text{font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ink);color:var(--bg);
  font-family:var(--font-m);font-size:11.5px;padding:7px 10px;border-radius:7px;white-space:nowrap;
  transform:translate(-50%,-115%);z-index:3;line-height:1.5}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{background:var(--surface);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
th.k,td.k{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;border-right:1px solid var(--line)}
thead th.k{z-index:3}
td.k{font-weight:600;color:var(--ink)}
td.k i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
td.k small{display:block;font-weight:500;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em}
td.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;color:var(--ink)}
td.d{font-family:var(--font-m);font-weight:500}
td.d.up{color:var(--s1)} td.d.dn{color:var(--s2)}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-family:var(--font-m);font-weight:500;color:var(--ink);background:var(--surface);border-top:2px solid var(--line);border-bottom:none}
tfoot td.k{font-family:var(--font-d);font-weight:700}
footer{font-size:11.5px;color:var(--ink-3);line-height:1.6}
[hidden]{display:none!important}
</style>

const pp=n=>(n==null||isNaN(n)||!isFinite(n))?'—':(n>=0?'+':'−')+p1(Math.abs(n));
const sum=a=>a.reduce((x,y)=>(x+(y||0)),0);
const rk=n=>nf(n/1000);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ojTot=mt=>mt[5]?`<td class="d ${mt[9]>=mt[5]?'up':'dn'}">${pp((mt[9]/mt[5]-1)*100)}%</td>`:'<td class="d">—</td>';

/* ===== util grafico ===== */
function eixoY(L,R,TOP,BOT,lo,hi,step,fmt){
  let s='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    const y=BOT-(v-lo)/(hi-lo)*(BOT-TOP);
    s+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="var(--font-d)">${fmt(v)}</text>`;}
  return s;}
function mesesX(L,R,BOT,n,labels){
  let s='';
  for(let i=0;i<n;i++){const x=L+i*(R-L)/(n-1);
    s+=`<text x="${x.toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${labels[i]}</text>`;}
  return s;}
function hover(box,tipId,hits,fn){
  const tip=box.querySelector('.tip');
  box.querySelectorAll(hits).forEach(r=>{
    const show=ev=>{const b=box.getBoundingClientRect();
      const d=fn(r,b); tip.style.left=d.x+'px'; tip.style.top=d.y+'px'; tip.innerHTML=d.html; tip.style.opacity=1;};
    r.addEventListener('mouseenter',show); r.addEventListener('mousemove',show);
    r.addEventListener('mouseleave',()=>tip.style.opacity=0);});}

/* ===== KPIs ===== */
function kpis(){
  const c=o(), mt=c.mt, tot=sum(mt);
  const t25=sum(c.mt25.slice(0,10));
  const tkAno=sum(mt.map((m,j)=>m*(c.tk[j]||0)))/tot;
  const h1=sum(mt.slice(0,6))/6, h2=sum(mt.slice(6))/4;
  const rec=c.rec[9];
  const el=[
   {l:'Vidas Jan–Out/26',v:nf(tot),s:t25?pp((tot/t25-1)*100)+'% vs Jan–Out/25':'—',c:t25&&tot>=t25?'up':'dn'},
   {l:'Outubro',v:nf(mt[9]),s:mt[8]?pp((mt[9]/mt[8]-1)*100)+'% vs setembro':'sem base em setembro',c:mt[8]&&mt[9]>=mt[8]?'up':'dn'},
   {l:'Ticket médio Out',v:c.tk[9]?'R$ '+nf(c.tk[9]):'—',s:tot?'ano: R$ '+nf(tkAno):'sem vendas'},
   {l:'Receita recorrente Out',v:'R$ '+rk(rec)+' mil',s:'mensalidade contratada no mês'},
   {l:'Ritmo jul–out vs jan–jun',v:h1?pp((h2/h1-1)*100)+'%':'—',s:nf(h1)+' → '+nf(h2)+' vidas/mês',c:h1&&h2>=h1?'up':'dn'}
  ];
  document.getElementById('kpis').innerHTML=el.map(k=>
    `<div class="kpi"><div class="lab">${k.l}</div><div class="val">${k.v}</div><div class="sub${k.c?' '+k.c:''}">${k.s}</div></div>`).join('');
}

function barras(id,arr,fmt,cor,aria){
  const W=560,H=300,L=46,R=542,TOP=24,BOT=238;
  const hi=Math.max(...arr.filter(v=>v!=null))*1.16, st=hi>900?250:hi>400?100:hi>150?50:hi>60?20:10;
  const cw=(R-L)/arr.length, bw=cw*0.6, y=v=>BOT-v/hi*(BOT-TOP);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`+eixoY(L,R,TOP,BOT,0,hi,st,fmt);
  arr.forEach((v,i)=>{const x=L+cw*i+(cw-bw)/2;
    if(v!=null){s+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(BOT-y(v)).toFixed(1)}" fill="${cor}" rx="2.5"/>`;
      s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y(v)-7).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-2)" font-family="var(--font-d)">${fmt(v)}</text>`;}
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${M[i]}</text>`;});
  s+='</svg>';
  document.getElementById(id).insertAdjacentHTML('afterbegin',s);}
function linha(id,arr,fmt,cor,aria){
  const W=560,H=300,L=46,R=542,TOP=26,BOT=238;
  const vv=arr.filter(v=>v!=null);
  let lo=Math.min(...vv), hi=Math.max(...vv); const pad=(hi-lo)*0.28||2; lo-=pad; hi+=pad;
  const st=(hi-lo)>40?10:(hi-lo)>16?5:(hi-lo)>8?2:1;
  const x=i=>L+i*(R-L)/(arr.length-1), y=v=>BOT-(v-lo)/(hi-lo)*(BOT-TOP);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`+eixoY(L,R,TOP,BOT,lo,hi,st,v=>fmt(v));
  let dd='',op=false;
  arr.forEach((v,i)=>{if(v==null){op=false;return;} dd+=(op?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; op=true;});
  if(dd) s+=`<path d="${dd.trim()}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>`;
  arr.forEach((v,i)=>{if(v==null)return;
    s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${cor}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const up=!(i>0&&i<arr.length-1&&arr[i-1]>v&&arr[i+1]>v);
    s+=`<text x="${x(i)}" y="${(y(v)+(up?-11:19)).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-family="var(--font-d)">${fmt(v)}</text>`;});
  s+=mesesX(L,R,BOT,arr.length,M);
  s+='</svg>';
  document.getElementById(id).insertAdjacentHTML('afterbegin',s);}

/* ===== empilhado 100% generico ===== */
function empilhado(id,series,cores,tintas,rotulos,aria){
  const c=o(), mt=c.mt;
  const W=620,H=330,L=40,R=606,TOP=14,BOT=252;
  const cw=(R-L)/10, bw=cw*0.66;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  [0,25,50,75,100].forEach(t=>{const yy=BOT-t/100*(BOT-TOP);
    s+=`<line x1="${L}" y1="${yy}" x2="${R}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--font-d)">${t}%</text>`;});
  for(let j=0;j<10;j++){
    const x=L+cw*j+(cw-bw)/2; let acc=0;
    series.forEach((row,g)=>{
      const v=mt[j]?row[j]/mt[j]*100:0; if(v<=0)return;
      const h=v/100*(BOT-TOP), y=BOT-(acc+v)/100*(BOT-TOP); acc+=v;
      s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h-2,0.5).toFixed(1)}" fill="${cores[g]}" rx="1.5"/>`;
      if(h>=16) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y+h/2+3.5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="500" fill="${tintas[g]}" font-family="var(--font-d)">${p1(v)}</text>`;});
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${M[j]}</text>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${BOT+34}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="var(--font-d)">${nf(mt[j])}</text>`;
    s+=`<rect class="he" data-j="${j}" x="${(L+cw*j).toFixed(1)}" y="${TOP}" width="${cw.toFixed(1)}" height="${BOT-TOP}" fill="transparent"/>`;}
  s+='</svg>';
  const b=document.getElementById(id); b.insertAdjacentHTML('afterbegin',s);
  hover(b,'.tip','.he',(r,bb)=>{const j=+r.dataset.j,k=bb.width/W;
    return {x:(L+cw*j+cw/2)*k,y:TOP*k+8,
      html:`<b>${M[j]}/26</b> · ${nf(mt[j])} vidas<br>`+series.map((row,g)=>({n:rotulos[g],v:mt[j]?row[j]/mt[j]*100:0,q:row[j]}))
        .filter(z=>z.q>0).sort((a,b2)=>b2.v-a.v).map(z=>`${esc(z.n)}: ${p1(z.v)}% (${nf(z.q)})`).join('<br>')};});}

/* ===== matriz generica ===== */
function matriz(alvo,linhas,getv,fmtv,extra,totalLinha,rodape){
  const mx=Math.max(...linhas.flatMap((_,i)=>M.map((_,j)=>getv(i,j)||0)),1);
  let h='<table><thead><tr><th class="k">'+alvo.rot+'</th><th>Ano</th>'+M.map(m=>`<th>${m}</th>`).join('')+
    (extra?extra.cab:'')+'</tr></thead><tbody>';
  linhas.forEach((ln,i)=>{
    h+=`<tr><td class="k">${ln.html}</td><td class="num">${totalLinha(i)}</td>`+
      M.map((_,j)=>{const v=getv(i,j);
        return `<td class="num" style="background:color-mix(in srgb, var(--s1) ${((v||0)/mx*76).toFixed(0)}%, transparent)">${fmtv(v)}</td>`;}).join('')+
      (extra?extra.cel(i):'')+'</tr>';});
  h+='</tbody><tfoot>'+rodape+'</tfoot></table>';
  return '<div class="tcard"><div class="scroll">'+h+'</div></div>';}

    <button type="button" data-x="l" aria-pressed="false">% do plano</button>
    <button type="button" data-x="c" aria-pressed="false">% da faixa</button>
    <button type="button" data-x="t" aria-pressed="false">Ticket</button>
  </div><span class="hint" id="hintCruz"></span></div>
  <div style="height:10px"></div><div id="x3"></div>`;}
let modoCruz='v';
function pintaCruz(){
  const c=o();
  const ativos=PL.map((p,i)=>i).filter(i=>sum(c.cruz[i])>0);
  // barras horizontais
  (function(){const n=ativos.length,W=580,H=40+n*42,L=122,R=562,TOP=24,bh=25,step=42;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuição etária das vendas de cada plano">`;
    [0,25,50,75,100].forEach(t=>{const xx=L+(R-L)*t/100;
      s+=`<line x1="${xx}" y1="${TOP-7}" x2="${xx}" y2="${TOP+n*step-17}" stroke="var(--line)" stroke-width="1"/>`+
         `<text x="${xx}" y="${TOP-13}" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--font-d)">${t}%</text>`;});
    ativos.forEach((i,k2)=>{const y=TOP+k2*step, tot=sum(c.cruz[i]); let acc=0;
      s+=`<text x="${L-9}" y="${y+16}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--ink)" font-family="var(--font-d)">${esc(PL[i])}</text>`;
      s+=`<text x="${L-9}" y="${y+28}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" font-family="var(--font-d)">${nf(tot)} vidas</text>`;
      GRP.forEach((g,gi)=>{const v=g[1].reduce((a,j)=>a+c.cruz[i][j],0)/tot*100; if(v<=0)return;
        const w=(R-L)*v/100, x=L+(R-L)*acc/100; acc+=v;
        s+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(w-2,0.5).toFixed(1)}" height="${bh}" fill="${RAMP[gi]}" rx="2"/>`;
        if(w>=32) s+=`<text x="${(x+w/2).toFixed(1)}" y="${y+16}" text-anchor="middle" font-size="10.5" font-weight="500" fill="${TINTA[gi]}" font-family="var(--font-d)">${p1(v)}</text>`;});});
    s+='</svg>';
    document.getElementById('x1').insertAdjacentHTML('afterbegin',s);})();
  // curva log
  (function(){const W=440,H=330,L=46,R=424,TOP=20,BOT=244;
    const top3=ativos.filter(i=>PL[i]!=='OUTROS').sort((a,b)=>sum(c.cruz[b])-sum(c.cruz[a])).slice(0,3);
    const vals=top3.flatMap(i=>c.cruztk[i]).filter(v=>v);
    const box=document.getElementById('x2');
    if(!vals.length){box.innerHTML='<p class="csub">Sem dados suficientes.</p>';return;}
    const lo=Math.min(...vals)*0.85, hi=Math.max(...vals)*1.18;
    const y=v=>BOT-(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*(BOT-TOP), x=j=>L+j*(R-L)/9;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ticket médio por faixa etária nas três famílias mais vendidas">`;
    [150,200,300,400,600,800,1200,1600,2400,3200,4800].filter(v=>v>=lo&&v<=hi).forEach(v=>{
      s+=`<line x1="${L}" y1="${y(v)}" x2="${R}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`+
         `<text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--font-d)">${nf(v)}</text>`;});
    top3.forEach(i=>{let d='',op=false;
      c.cruztk[i].forEach((v,j)=>{if(!v){op=false;return;} d+=(op?'L':'M')+x(j).toFixed(1)+' '+y(v).toFixed(1)+' '; op=true;});
      if(d) s+=`<path d="${d.trim()}" fill="none" stroke="${COR[i]}" stroke-width="2.5" stroke-linejoin="round"/>`;
      c.cruztk[i].forEach((v,j)=>{if(v) s+=`<circle cx="${x(j)}" cy="${y(v)}" r="3.2" fill="${COR[i]}" stroke="var(--surface)" stroke-width="1.5"/>`;});});
    FX.forEach((f,j)=>{if(j%2===0||j===9) s+=`<text x="${x(j)}" y="${BOT+17}" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="var(--font-d)">${f}</text>`;});
    for(let j=0;j<10;j++) s+=`<rect class="hx" data-j="${j}" x="${(x(j)-(R-L)/18).toFixed(1)}" y="${TOP}" width="${((R-L)/9).toFixed(1)}" height="${BOT-TOP}" fill="transparent"/>`;
    s+='</svg>';
    box.insertAdjacentHTML('afterbegin',s);
    hover(box,'.tip','.hx',(r,bb)=>{const j=+r.dataset.j,k=bb.width/W;
      return {x:x(j)*k,y:TOP*k+8,html:`<b>${FX[j]} anos</b><br>`+top3.map(i=>`${esc(PL[i])}: ${c.cruztk[i][j]?'R$ '+nf(c.cruztk[i][j]):'—'}`).join('<br>')};});
    document.getElementById('xleg').innerHTML=top3.map(i=>`<span><i style="background:${COR[i]}"></i>${esc(PL[i])}</span>`).join('');})();
  pintaMatrizCruz();
  document.querySelectorAll('#segCruz [data-x]').forEach(b=>b.onclick=()=>{modoCruz=b.dataset.x;
    document.querySelectorAll('#segCruz [data-x]').forEach(z=>z.setAttribute('aria-pressed',z===b));
    pintaMatrizCruz();});}
function pintaMatrizCruz(){
  const c=o(), ativos=PL.map((p,i)=>i).filter(i=>sum(c.cruz[i])>0);
  const colT=j=>PL.reduce((a,_,i)=>a+c.cruz[i][j],0);
  const tot=sum(FX.map((_,j)=>colT(j)));
  const EXPL={v:'Vidas vendidas em cada cruzamento.',l:'Cada linha soma 100%: o perfil etário do plano.',
    c:'Cada coluna soma 100%: quanto cada plano representa das vendas daquela idade.',t:'Ticket médio em R$.'};
  const val=(i,j)=>modoCruz==='v'?c.cruz[i][j]:modoCruz==='l'?(sum(c.cruz[i])?c.cruz[i][j]/sum(c.cruz[i])*100:0)
    :modoCruz==='c'?(colT(j)?c.cruz[i][j]/colT(j)*100:0):c.cruztk[i][j];
  const fmt=v=>v==null?'—':(modoCruz==='v'||modoCruz==='t'?nf(v):p1(v));
  const mx=Math.max(...ativos.flatMap(i=>FX.map((_,j)=>val(i,j)||0)),1);
  let h='<table><thead><tr><th class="k">Plano</th>'+FX.map(f=>`<th>${f}</th>`).join('')+'<th>Total</th></tr></thead><tbody>';
  ativos.forEach(i=>{h+=`<tr><td class="k"><i style="background:${COR[i]}"></i>${esc(PL[i])}</td>`+
    FX.map((_,j)=>{const v=val(i,j);return `<td class="num" style="background:color-mix(in srgb, var(--s1) ${((v||0)/mx*76).toFixed(0)}%, transparent)">${fmt(v)}</td>`;}).join('')+
    `<td class="num">${modoCruz==='l'?'100,0':modoCruz==='c'?p1(sum(c.cruz[i])/tot*100):modoCruz==='t'?'—':nf(sum(c.cruz[i]))}</td></tr>`;});
  h+='</tbody><tfoot><tr><td class="k">Total</td>'+FX.map((_,j)=>`<td>${modoCruz==='c'?'100,0':modoCruz==='l'?p1(colT(j)/tot*100):modoCruz==='t'?'—':nf(colT(j))}</td>`).join('')+
    `<td>${modoCruz==='v'?nf(tot):'—'}</td></tr></tfoot></table>`;
  document.getElementById('x3').innerHTML='<div class="tcard"><div class="scroll">'+h+'</div></div>';
  document.getElementById('hintCruz').textContent=EXPL[modoCruz];}

/* ===== ABA: cidades ===== */
function abaCidade(){ return unidadeBar()+'<div style="height:10px"></div><div id="c1"></div>'; }
function pintaCidade(){
  const c=o(), mt=c.mt, tot=sum(mt), h1=sum(mt.slice(0,6)), h2=sum(mt.slice(6));
  const L=c.cid;
  document.getElementById('c1').innerHTML=matriz(
    {rot:'Cidade'}, L.map(x=>({html:`${esc(x.n.split('/')[0])}<small>${esc(x.n.split('/')[1])}</small>`})),
    (i,j)=>unidade==='pct'?(mt[j]?L[i].m[j]/mt[j]*100:0):L[i].m[j],
    v=>unidade==='pct'?p1(v):nf(v),
    {cab:'<th>Ticket</th><th>Δ pp</th><th>Out × Jun</th>',
     cel:i=>{const a=sum(L[i].m.slice(0,6))/h1*100,b=sum(L[i].m.slice(6))/h2*100;
       const jn=L[i].m[5],ot=L[i].m[9],v=jn?(ot/jn-1)*100:null;
       return `<td class="num">${nf(L[i].tk)}</td><td class="d ${b-a>=0?'up':'dn'}">${pp(b-a)}</td>`+
         `<td class="d ${v==null?'':(v>=0?'up':'dn')}">${v==null?'—':pp(v)+'%'}</td>`;}},
    i=>unidade==='pct'?p1(sum(L[i].m)/tot*100):nf(sum(L[i].m)),
    `<tr><td class="k">Top ${L.length}</td><td>${unidade==='pct'?p1(sum(L.map(x=>sum(x.m)))/tot*100):nf(sum(L.map(x=>sum(x.m))))}</td>`+
    M.map((_,j)=>`<td>${unidade==='pct'?p1(sum(L.map(x=>x.m[j]))/mt[j]*100):nf(sum(L.map(x=>x.m[j])))}</td>`).join('')+
    '<td></td><td></td><td></td></tr>');}

/* ===== ABA: 0 a 8 anos ===== */
function abaO8(){
  return `<div class="row2 even">
    <section class="card"><h2>Vidas de 0 a 8 anos por mês</h2><p class="csub">Comparação entre canais.</p>
      <div class="chartbox" id="o1"><div class="tip"></div></div>
      <div class="legend" id="oleg"></div></section>
    <section class="card"><h2>Receita de 0 a 8 anos por mês</h2><p class="csub">Mensalidade contratada, em R$ mil.</p>
      <div class="chartbox" id="o2"><div class="tip"></div></div></section>
  </div>
  <div style="height:14px"></div><div id="o3"></div>`;}
function pintaO8(){
  const CS=['IND','PIM','ADM'];
  const serie=k=>DB.d[k].o8, serieR=k=>DB.d[k].o8r;
  const draw=(id,get,fmt,aria)=>{
    const W=560,H=300,L=46,R=542,TOP=24,BOT=238;
    const hi=Math.max(...CS.flatMap(k=>get(k)))*1.14||1;
    const cw=(R-L)/10, bw=cw*0.22, gap=2.5, y=v=>BOT-v/hi*(BOT-TOP);
    const st=hi>1500?500:hi>600?200:hi>200?100:50;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`+eixoY(L,R,TOP,BOT,0,hi,st,v=>fmt(v));
    for(let j=0;j<10;j++){
      const x0=L+cw*j+(cw-(bw*3+gap*2))/2;
      CS.forEach((k,g)=>{const v=get(k)[j], xx=x0+g*(bw+gap);
        s+=`<rect x="${xx.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(BOT-y(v)).toFixed(1)}" fill="${COR[g]}" rx="2"/>`;});
      s+=`<text x="${(L+cw*j+cw/2).toFixed(1)}" y="${BOT+18}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--font-d)">${M[j]}</text>`;
      s+=`<rect class="ho" data-j="${j}" x="${(L+cw*j).toFixed(1)}" y="${TOP}" width="${cw.toFixed(1)}" height="${BOT-TOP}" fill="transparent"/>`;}
    s+='</svg>';
    const b=document.getElementById(id); b.insertAdjacentHTML('afterbegin',s);
    hover(b,'.tip','.ho',(r,bb)=>{const j=+r.dataset.j,k2=bb.width/W;
      return {x:(L+cw*j+cw/2)*k2,y:TOP*k2+8,html:`<b>${M[j]}/26</b><br>`+CS.map(k=>`${META.canais[k]}: ${fmt(get(k)[j])}`).join('<br>')};});};
  draw('o1',serie,v=>nf(v),'Vidas de 0 a 8 anos por mês e canal');
  draw('o2',k=>serieR(k).map(v=>v/1000),v=>nf(v),'Receita de 0 a 8 anos por mês e canal');
  document.getElementById('oleg').innerHTML=CS.map((k,g)=>`<span><i style="background:${COR[g]}"></i>${META.canais[k]}</span>`).join('');
  let h='<table><thead><tr><th class="k">Canal</th><th>Vidas 0–8</th><th>% do canal</th><th>Ticket</th><th>Receita/mês</th>'+
    '<th>Média jan–jun</th><th>Média jul–out</th><th>Variação</th></tr></thead><tbody>';
  CS.concat(['MID']).forEach((k,g)=>{const c=DB.d[k]; const v=sum(c.o8); if(!v)return;
    const r=sum(c.o8r), m1=sum(c.o8.slice(0,6))/6, m2=sum(c.o8.slice(6))/4;
    h+=`<tr><td class="k"><i style="background:${COR[g]}"></i>${META.canais[k]}</td>`+
      `<td class="num">${nf(v)}</td><td class="num">${p1(v/sum(c.mt)*100)}</td><td class="num">${nf(r/v)}</td>`+
      `<td class="num">${nf(r)}</td><td class="num">${nf(m1)}</td><td class="num">${nf(m2)}</td>`+
      `<td class="d ${m2>=m1?'up':'dn'}">${pp((m2/m1-1)*100)}%</td></tr>`;});
  h+='</tbody></table>';
  document.getElementById('o3').innerHTML='<div class="tcard"><div class="scroll">'+h+'</div></div>';}

/* ===== chrome ===== */
function unidadeBar(){
  return `<div class="bar"><div class="seg" role="group" aria-label="Unidade" id="segUni">
    <button type="button" data-u="pct" aria-pressed="${unidade==='pct'}">% do mês</button>
    <button type="button" data-u="abs" aria-pressed="${unidade==='abs'}">Vidas</button>
  </div><span class="hint">Δ pp compara jul–out com jan–jun. Out × Jun é a variação de vidas entre junho e outubro.</span></div>`;}
const ABAS=[['geral','Visão geral',abaGeral,pintaGeral],
  ['faixa','Faixa etária',abaFaixa,pintaFaixa],
  ['plano','Aquisição por plano',abaPlano,pintaPlano],
  ['cruz','Plano × Faixa',abaCruz,pintaCruz],
  ['cidade','Cidades',abaCidade,pintaCidade],
  ['o8','0 a 8 anos',abaO8,pintaO8]];
document.getElementById('tabs').innerHTML=ABAS.map(a=>
  `<button type="button" role="tab" data-a="${a[0]}" aria-selected="${a[0]===aba}">${a[1]}</button>`).join('');
document.getElementById('segCanal').innerHTML=Object.keys(META.canais).map(k=>
  `<button type="button" data-k="${k}" aria-pressed="${k===canal}"${META.grupo&&META.grupo[k]==='o'?' style="border-left:1px solid var(--line);border-radius:0 7px 7px 0;margin-left:3px"':''}>${META.canais[k]}</button>`).join('');
document.getElementById('corte').textContent='Corte '+META.corte+' · '+nf(META.base)+' registros na base';
document.getElementById('rodape').innerHTML='Vidas por mês de cadastramento · ticket = mensalidade média · receita = soma das mensalidades contratadas no mês · '+
  'base BASE_DIGITAL_FULL, corte '+META.corte+'. Para atualizar, substitua o bloco de dados no topo do script.';
function render(){
  const A=ABAS.find(a=>a[0]===aba);
  const extra=canal==='HCOR'?' Corretoras parceiras na plataforma HapON; a venda começou em agosto.':
    canal==='HINT'?' Tudo o que não veio pelas corretoras da HapON.':
    canal==='HTOT'?' Soma de HapON Interno ('+nf(sum(DB.d.HINT.mt))+') + HapON Corretoras ('+nf(sum(DB.d.HCOR.mt))+') — mesma base de Todos os canais.':'';
  document.getElementById('hintCanal').textContent=nf(sum(o().mt))+' vidas em '+META.canais[canal]+', Jan–Out/26.'+extra;
  kpis();
  document.getElementById('painel').innerHTML=A[2]();
  A[3]();
  document.querySelectorAll('#segUni [data-u]').forEach(b=>b.onclick=()=>{unidade=b.dataset.u;render();});
}
document.querySelectorAll('#tabs [data-a]').forEach(b=>b.onclick=()=>{aba=b.dataset.a;
  document.querySelectorAll('#tabs [data-a]').forEach(z=>z.setAttribute('aria-selected',z===b)); render();});
document.querySelectorAll('#segCanal [data-k]').forEach(b=>b.onclick=()=>{canal=b.dataset.k;
  document.querySelectorAll('#segCanal [data-k]').forEach(z=>z.setAttribute('aria-pressed',z===b)); render();});
render();
</script>
